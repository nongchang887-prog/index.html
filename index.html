<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เช็กการเชื่อมต่อและส่ง Discord</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #111318;
      color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #1b1f27;
      border: 1px solid #2d3340;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 12px;
    }
    p {
      font-size: 13px;
      color: #9ca3af;
      margin: 0 0 16px;
    }
    button {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background: #5865f2;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #4752c4;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      background: #111318;
      border: 1px solid #2d3340;
      font-size: 14px;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>เทสต์ส่งข้อความไป Discord</h1>
    <p>เรียกผ่าน Supabase Edge Function: send-discord</p>
    <button type="button" id="sendBtn">กดเทสต์ส่งข้อความ</button>
    <div class="status" id="status">สถานะ: ยังไม่ได้กด</div>
  </div>

  <script>
    const PROJECT_REF = "ztkqtvdllpzjsvlqxzni";
    const FUNCTION_NAME = "send-discord";
    const SUPABASE_API_KEY = "sb_publishable_cDqZ3DmFATvHvY1GVYUUXA_Z8V8c3pH";

    const SUPABASE_FUNCTION_URL = `https://${PROJECT_REF}.supabase.co/functions/v1/${FUNCTION_NAME}`;

    const sendBtn = document.getElementById("sendBtn");
    const statusEl = document.getElementById("status");

    sendBtn.addEventListener("click", async () => {
      sendBtn.disabled = true;
      statusEl.textContent = "สถานะ: กำลังส่งข้อความ...";

      try {
        const res = await fetch(SUPABASE_FUNCTION_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${SUPABASE_API_KEY}`,
            "apikey": SUPABASE_API_KEY,
          },
          body: JSON.stringify({
            pageUrl: window.location.href,
            name: "Functions",
          }),
        });

        const data = await res.json().catch(() => ({}));

        if (res.ok && data.ok !== false) {
          statusEl.textContent = "สถานะ: ✅ ส่งสำเร็จ — ข้อความเข้า Discord แล้ว";
        } else {
          statusEl.textContent = `สถานะ: ❌ ส่งไม่สำเร็จ (HTTP ${res.status}: ${data.error || data.message || "ตรวจสอบ Edge Function"})`;
        }
      } catch (err) {
        const reason = err instanceof Error ? err.message : String(err);
        statusEl.textContent = `สถานะ: ❌ เรียก Edge Function ไม่สำเร็จ (${reason})`;
      } finally {
        sendBtn.disabled = false;
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เช็กการเชื่อมต่อและส่ง Discord</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #111318;
      color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #1b1f27;
      border: 1px solid #2d3340;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 12px;
    }
    p {
      font-size: 13px;
      color: #9ca3af;
      margin: 0 0 16px;
    }
    button {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background: #5865f2;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #4752c4;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      background: #111318;
      border: 1px solid #2d3340;
      font-size: 14px;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>เทสต์ส่งข้อความไป Discord</h1>
    <p>เรียกผ่าน Supabase Edge Function โดยใช้ Secret ชื่อ DISCORD_WEBHOOK_URL</p>
    <button type="button" id="sendBtn">กดเทสต์ส่งข้อความ</button>
    <div class="status" id="status">สถานะ: ยังไม่ได้กด</div>
  </div>

  <script>
    // เปลี่ยน <PROJECT_REF> เป็นรหัสโปรเจกต์ Supabase ของคุณ
    const SUPABASE_FUNCTION_URL = "https://<PROJECT_REF>.supabase.co/functions/v1/send-discord";

    // ตัวอย่างโค้ดฝั่ง Supabase Edge Function (นำไปวางในฟังก์ชัน send-discord บน Supabase):
    /*

      "Access-Control-Allow-Origin": "*",
      "Access-Control-Allow-Headers": "authorization, x-client-info, apikey, content-type",
    };

        return new Response("ok", { headers: corsHeaders });

          return new Response(
            JSON.stringify({ ok: false, error: "ไม่พบ Secret ชื่อ DISCORD_WEBHOOK_URL" }),
            { status: 500, headers: { ...corsHeaders, "Content-Type": "application/json" } }
          );
        }

        const body = await req.json().catch(() => ({}));
        const pageUrl = typeof body.pageUrl === "string" ? body.pageUrl : window.location.href;

        const discordRes = await fetch(webhookUrl, {
          method: "POST",

          }),

        if (!discordRes.ok) {

        }

      } catch (err) {

          JSON.stringify({ ok: false, error: err instanceof Error ? err.message : "เกิดข้อผิดพลาด" }),

    */

    const sendBtn = document.getElementById("sendBtn");
    const statusEl = document.getElementById("status");

    sendBtn.addEventListener("click", async () => {
      sendBtn.disabled = true;
      statusEl.textContent = "สถานะ: กำลังส่งข้อความ...";

      try {
        const res = await fetch(SUPABASE_FUNCTION_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            pageUrl: window.location.href,
          }),
        });

        const data = await res.json().catch(() => ({}));

        if (res.ok && data.ok) {
          statusEl.textContent = "สถานะ: ✅ ส่งสำเร็จ — เว็บต่อเน็ตได้";
        } else {
          statusEl.textContent = `สถานะ: ❌ ส่งไม่สำเร็จ (${data.error || res.status})`;
        }
      } catch (err) {
        statusEl.textContent = "สถานะ: ❌ ส่งไม่สำเร็จ — เว็บต่อเน็ตไม่ได้";
      } finally {
        sendBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
